plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def testRuntimeJava = Integer.parseInt(providers.gradleProperty('test_runtime_java').getOrElse('21'))
def clientGameTestsAvailable = minecraftVersion != '1.20.1'
def usesRemappedLoom = minecraftVersion != '26.3'
apply plugin: (usesRemappedLoom ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom')

group = 'net.aerix.trinkies.tests'
version = '1.0.0'
base.archivesName = 'trinkies-client-gametest'

def modDependencyConfiguration = usesRemappedLoom ? 'modImplementation' : 'implementation'
def testRuntimeLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(testRuntimeJava)
}

repositories {
    // Loom supplies Minecraft and Fabric's repositories. The root repo policy is isolated by this build.
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (usesRemappedLoom) {
        mappings loom.officialMojangMappings()
    }
    add(modDependencyConfiguration, "net.fabricmc:fabric-loader:${loader_version}")
    add(modDependencyConfiguration, "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    // Test the same JAR that the launcher packages, not a second copy of Trinkies sources.
    add(modDependencyConfiguration, fileTree(
        dir: file('../../app_pojavlauncher/build/intermediates/package_jar_deps/components/aerix_client'),
        include: ['*.jar']
    ))
}

if (clientGameTestsAvailable) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'trinkies-gametest'
            enableGameTests = false
            enableClientGameTests = true
            eula = true
            username = 'AerixTestPlayer'
        }
    }

    // The client GameTest source set has to see main's classes: the shared loadout round-trip probe
    // lives in src/main/java so that the modern branch and the 1.20.1 branch exercise the same file
    // instead of two copies that can drift.
    //
    // Loom creates that source set from configureTests, and it does so inside its own afterEvaluate
    // hook, so `sourceSets.gametest` here is "Could not get unknown property 'gametest' for SourceSet
    // container" and the build dies before any client starts. Register after Loom instead, look the
    // set up by name, and say plainly if the wiring ever stops matching so the failure is not silent.
    project.afterEvaluate {
        def gameTestSourceSet = sourceSets.findByName('gametest')
        if (gameTestSourceSet == null) {
            throw new GradleException(
                "Loom did not create the 'gametest' source set, so the loadout probe cannot be put on " +
                "its classpath. Check that configureTests still owns createSourceSet before renaming " +
                "anything; silently skipping this would let the client test compile against nothing.")
        }
        gameTestSourceSet.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        gameTestSourceSet.runtimeClasspath += sourceSets.main.output
    }
} else {
    // Fabric's client-game-test API does not exist on 1.20.1. Use a test-only client entrypoint
    // to verify the packaged mod can initialize under that version's Java 17 runtime.
    sourceSets.main.java.srcDir('src/legacy/java')
    sourceSets.main.resources.srcDir('src/legacy/resources')
}

tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraftVersion
    filesMatching('fabric.mod.json') {
        expand([
            version: project.version,
            minecraft_version: minecraftVersion
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = testRuntimeJava
}

tasks.withType(JavaExec).configureEach {
    // Loom/Gradle runs on JDK 25; launch each game on its approved runtime from the matrix.
    javaLauncher.set(testRuntimeLauncher)
    systemProperty 'trinkies.test.minecraft_version', minecraftVersion
}

if (!clientGameTestsAvailable) {
    def successMarker = layout.buildDirectory.file("matrix-artifacts/${minecraftVersion}/client-boot-smoke.ok")
    tasks.named('runClient').configure {
        systemProperty 'trinkies.test.success_marker', successMarker.get().asFile.absolutePath
    }

    tasks.register('verifyClientBootSmoke') {
        group = 'verification'
        description = 'Launches the 1.20.1 client and verifies the packaged Trinkies mod initializes.'
        dependsOn tasks.named('runClient')
        doLast {
            def markerFile = successMarker.get().asFile
            if (!markerFile.isFile()) {
                throw new GradleException("Client boot smoke test did not write ${markerFile}")
            }
            println("Verified ${minecraftVersion} client boot: ${markerFile.text.trim()}")
        }
    }
}
