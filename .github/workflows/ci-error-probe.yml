name: CI error probe

# Temporary: compiles the app and writes the compiler output into ci-error.txt so the failure can
# be read without the Actions log (which is not reachable from every environment). Removed once
# the build is green again.

on:
  push:
    branches: [ "arena/2f1249a3-aerix-launcher" ]
    paths: [ ".github/workflows/ci-error-probe.yml" ]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile and record the output
        shell: bash
        run: |
          set +e
          gradle :app_pojavlauncher:compileFullDebugKotlin --console=plain --stacktrace > build.log 2>&1
          STATUS=$?
          {
            echo "exit=$STATUS"
            echo "----- errors -----"
            grep -n -E "^e: |error:|FAILURE|What went wrong|> Task .* FAILED" build.log | head -120
            echo "----- tail -----"
            tail -60 build.log
          } > ci-error.txt
          cat ci-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-error.txt
          git commit -m "ci: compiler output (exit $STATUS) [skip ci]"
          git push origin HEAD:arena/2f1249a3-aerix-launcher
          exit $STATUS
