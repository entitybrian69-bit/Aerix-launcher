name: Aerix PC Release

# Trigger manually via workflow_dispatch, by pushing tag pc-v*, or by committing PC_RELEASE_MARK=2.4.5.
on:
  workflow_dispatch:
  push:
    tags:
      - 'pc-v*'
    paths:
      - 'aerix-pc/**'
      - '.github/workflows/pc-release.yml'

jobs:
  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: aerix-pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: aerix-pc/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  build:
    name: Package (${{ matrix.label }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/pc-v') || contains(github.event.head_commit.message, 'PC_RELEASE_MARK=')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            script: dist:win
          - label: Linux x64
            os: ubuntu-22.04
            script: dist:linux
          - label: macOS arm64 + x64
            os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: aerix-pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: aerix-pc/package-lock.json
      - run: npm ci
      - name: Build release installer
        shell: bash
        run: |
          set -o pipefail
          if ! npm run ${{ matrix.script }} 2>&1 | tee build.log; then
            TAIL=$(tail -n 25 build.log | tr '\n' ' ')
            echo "::error title=electron-builder failed::${TAIL}"
            exit 1
          fi
      - name: Collect release installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp release/Aerix-PC-*.* out/ 2>/dev/null || true
          rm -f out/*.blockmap out/*.yml out/latest*.yml 2>/dev/null || true
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: aerix-pc-release-${{ runner.os }}
          path: aerix-pc/out/*
          if-no-files-found: error

  publish:
    name: Publish Aerix PC Release Assets
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aerix-pc-release-*
          path: pc-out
          merge-multiple: true
      - name: Upload canonical and versioned PC assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./aerix-pc/package.json').version")
          cd pc-out
          # Create stable unversioned filenames alongside versioned ones so website links never go stale
          test -f "Aerix-PC-$VERSION-win-x64.exe" && cp "Aerix-PC-$VERSION-win-x64.exe" "Aerix-PC-Setup.exe"
          test -f "Aerix-PC-$VERSION-win-x64.zip" && cp "Aerix-PC-$VERSION-win-x64.zip" "Aerix-PC-win-x64.zip"
          test -f "Aerix-PC-$VERSION-linux-x64.AppImage" && cp "Aerix-PC-$VERSION-linux-x64.AppImage" "Aerix-PC-linux-x86_64.AppImage"
          test -f "Aerix-PC-$VERSION-linux-x64.deb" && cp "Aerix-PC-$VERSION-linux-x64.deb" "Aerix-PC-linux-amd64.deb"
          test -f "Aerix-PC-$VERSION-linux-x64.tar.gz" && cp "Aerix-PC-$VERSION-linux-x64.tar.gz" "Aerix-PC-linux-x64.tar.gz"
          test -f "Aerix-PC-$VERSION-mac-arm64.dmg" && cp "Aerix-PC-$VERSION-mac-arm64.dmg" "Aerix-PC-mac-arm64.dmg"
          test -f "Aerix-PC-$VERSION-mac-x64.dmg" && cp "Aerix-PC-$VERSION-mac-x64.dmg" "Aerix-PC-mac-x64.dmg"
          sha256sum Aerix-PC-* > SHA256SUMS-PC.txt
          ls -lh

          # Attach to existing v$VERSION release if present (keeps releases/latest unified for Android + PC),
          # otherwise create/update pc-v$VERSION.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" Aerix-PC-* SHA256SUMS-PC.txt --clobber
          elif gh release view "pc-v$VERSION" >/dev/null 2>&1; then
            gh release upload "pc-v$VERSION" Aerix-PC-* SHA256SUMS-PC.txt --clobber
          else
            gh release create "pc-v$VERSION" \
              --title "Aerix Launcher PC v$VERSION" \
              --notes "Aerix Launcher PC v$VERSION for Windows (x64), Linux (x64), and macOS (Apple Silicon & Intel)." \
              --target "$GITHUB_SHA" \
              Aerix-PC-* SHA256SUMS-PC.txt
          fi
