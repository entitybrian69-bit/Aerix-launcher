name: Site preview shots

# Temporary helper: renders the static site in headless Chromium so the pages can
# be eyeballed without a local browser. Manual only; never wired into deploy.
on:
  push:
    paths:
      - "docs/**"
      - "tools/shoot_site.py"
      - ".github/workflows/preview-shots.yml"
    branches-ignore:
      - v3_openjdk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Serve docs/
        run: |
          nohup python -m http.server 8123 --bind 127.0.0.1 --directory docs >/tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8123/ >/dev/null && break; sleep 1; done
          curl -sf -o /dev/null -w 'index %{http_code}\n' http://127.0.0.1:8123/

      - name: Screenshot every page
        run: python tools/shoot_site.py

      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site-preview/
          if-no-files-found: error

