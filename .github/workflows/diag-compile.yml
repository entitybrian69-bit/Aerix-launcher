name: diag compile

on:
  push:
    paths:
      - '.github/workflows/diag-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin (full debug) and surface compiler errors
        run: |
          set +e
          ./gradlew :app_pojavlauncher:compileFullDebugKotlin --console=plain -q > k.log 2>&1
          code=$?
          echo "gradle exit=$code"
          grep -E "^e: |error: " k.log | sed 's/^\/home\/runner\/work\/Aerix-launcher\/Aerix-launcher\///' | sort -u | head -50 | while read -r l; do
            echo "::error title=kotlinc::$(printf '%s' "$l" | head -c 500)"
          done
          if ! grep -qE "^e: " k.log && [ "$code" != "0" ]; then
            tail -15 k.log | while read -r l; do echo "::notice title=raw::$(printf '%s' "$l" | head -c 500)"; done
          fi
          exit 0
