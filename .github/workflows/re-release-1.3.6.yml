name: manual re-release 1.3.6

on:
  push:
    paths:
      - '.github/workflows/re-release-1.3.6.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_SHA: a75fdfeb6c22ebf0c772c0a4f83ab53c103e4ad81d8105789deb0df9ebc232f3
  NEW_TAG: v1.3.6
  NEW_VERSION: "1.3.6"

jobs:
  rerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Locate APK by sha256 and re-release as 1.3.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${{ github.repository }}"
          export repo TARGET_SHA
          mkdir -p sums scan out results

          echo "== Build the unique APK candidate list (deduped by tag+size)"
          gh api "repos/$repo/releases?per_page=100" --paginate \
            --jq '.[] | .tag_name as $t | .published_at as $p | .assets[] | select(.name | endswith(".apk")) | "\($p)\t\($t)\t\(.name)\t\(.size)"' < /dev/null \
            | sort -r | awk -F'\t' '!seen[$2 FS $4]++' > apks.tsv
          # tags fully verified in the previous run, skip them
          grep -v -E '\t(build-39597412773|build-39554531592|v1\.3\.5)\t' apks.tsv > remaining.tsv || true
          wc -l remaining.tsv

          scan_one() {
            local pub="$1" tag="$2" name="$3" size="$4"
            echo "--- $tag / $name ($size bytes)"
            if gh release download "$tag" -p "$name" -D scan --clobber -R "$repo" < /dev/null; then
              sha=$(sha256sum "scan/$name" | awk '{print $1}')
              echo "$tag|$name|$sha" >> results/hashes.txt
              echo "::notice title=apk-sha::$tag / $name = $sha"
              if [ "$sha" = "$TARGET_SHA" ]; then
                echo "$tag" > results/match_tag
                echo "$name" > results/match_name
              fi
              rm -f "scan/$name"
            else
              echo "::warning title=dl-fail::$tag / $name"
            fi
          }
          export -f scan_one

          echo "== Parallel sha256 scan (4 downloads at a time)"
          while IFS=$'\t' read -r pub tag name size; do
            printf '%s\0%s\0%s\0%s\0' "$pub" "$tag" "$name" "$size"
          done < remaining.tsv | xargs -0 -P 4 -n 4 bash -c 'scan_one "$@"' _

          if [ ! -f results/match_tag ]; then
            echo "::error title=no-match::no release APK matched sha256 $TARGET_SHA anywhere (scanned hashes are in apk-sha notices)"
            exit 1
          fi
          found_tag=$(cat results/match_tag)
          found_name=$(cat results/match_name)
          echo "MATCH: $found_tag / $found_name"

          echo "== Collect the full + noruntime pair from the same source release"
          src_body=$(gh api "repos/$repo/releases/tags/$found_tag" --jq '.body // ""' < /dev/null)
          gh api "repos/$repo/releases/tags/$found_tag" --jq '.assets[] | select(.name | endswith(".apk")) | .name' < /dev/null | sort -u > siblings.txt
          : > SHA256SUMS
          while read -r sib; do
            [ -z "$sib" ] && continue
            if [ "$sib" = "$found_name" ] && [ -f "scan/$found_name" ]; then
              f="scan/$found_name"
            else
              gh release download "$found_tag" -p "$sib" -D scan --clobber -R "$repo" < /dev/null
              f="scan/$sib"
            fi
            ssha=$(sha256sum "$f" | awk '{print $1}')
            case "$sib" in
              *noruntime*) base="Aerix-Launcher-$NEW_VERSION-noruntime.apk";;
              *) base="Aerix-Launcher-$NEW_VERSION.apk";;
            esac
            cp "$f" "out/$base"
            echo "$ssha  $base" >> SHA256SUMS
          done < siblings.txt

          echo "== Mirror the v1.3.x unversioned duplicate names"
          for f in out/*.apk; do
            b=$(basename "$f")
            unv=$(printf '%s' "$b" | sed "s/-$NEW_VERSION//")
            cp "$f" "out/$unv"
            grep "  $b\$" SHA256SUMS | sed "s/  $b\$/  $unv/" >> SHA256SUMS
          done
          sort -u SHA256SUMS -o SHA256SUMS
          cat SHA256SUMS

          target=$(printf '%s' "$src_body" | grep -oE 'build of [0-9a-f]{7,40}' | awk '{print $3}' | head -1)

          notes=$(mktemp)
          {
            echo "Re-release of the exact binary identified by"
            echo "\`sha256:$TARGET_SHA\` as version $NEW_VERSION."
            echo ""
            echo "Source artifact: \`$found_name\` from release \`$found_tag\`."
            if [ -n "$target" ]; then echo "Built from commit \`$target\`."; fi
            echo ""
            echo "Checksums for every attachment are in \`SHA256SUMS\`."
          } > "$notes"

          create_args=(--repo "$repo" --title "Aerix Launcher $NEW_VERSION" --notes-file "$notes" --latest)
          if [ -n "$target" ]; then create_args+=(--target "$target"); fi
          gh release create "$NEW_TAG" "${create_args[@]}" out/*.apk SHA256SUMS < /dev/null
          echo "::notice title=done::released $NEW_TAG from $found_tag / $found_name"
