name: manual re-release 1.3.6

on:
  push:
    paths:
      - '.github/workflows/re-release-1.3.6.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_SHA: a75fdfeb6c22ebf0c772c0a4f83ab53c103e4ad81d8105789deb0df9ebc232f3
  NEW_TAG: v1.3.6
  NEW_VERSION: "1.3.6"

jobs:
  rerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Locate APK by sha256 and re-release as 1.3.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${{ github.repository }}"
          export repo TARGET_SHA
          mkdir -p scan out results art

          record_match() { # source_desc path
            echo "$1" > results/match_src
            echo "$2" > results/match_file
          }
          export -f record_match

          scan_file() { # path source_desc
            local f="$1" src="$2"
            [ -f "$f" ] || return 0
            local sha
            sha=$(sha256sum "$f" | awk '{print $1}')
            echo "$src|$sha" >> results/hashes.txt
            echo "::notice title=apk-sha::$src = $sha"
            if [ "$sha" = "$TARGET_SHA" ] && [ ! -f results/match_src ]; then
              record_match "$src" "$f"
            fi
          }
          export -f scan_file

          echo "== Pass 0: Emesis-renderer- repo assets (public repo, anonymous download)"
          mkdir -p scan/emesis
          gh api "repos/entitybrian69-bit/Emesis-renderer-/releases?per_page=100" --paginate \
            --jq '.[] | .tag_name as $t | .assets[] | "\($t)\t\(.name)"' < /dev/null | sort -u > emesis.tsv || true
          wc -l emesis.tsv
          emdl_one() {
            local tag="$1" name="$2"
            mkdir -p "scan/emesis/$tag"
            if curl -Lsf --retry 2 "https://github.com/entitybrian69-bit/Emesis-renderer-/releases/download/$tag/$name" -o "scan/emesis/$tag/$name"; then
              scan_file "scan/emesis/$tag/$name" "emesis:$tag/$name"
              rm -f "scan/emesis/$tag/$name"
            else
              echo "::warning title=emesis-dl-fail::$tag/$name"
            fi
          }
          export -f emdl_one
          while IFS=$'\t' read -r tag name; do
            printf '%s\0%s\0' "$tag" "$name"
          done < emesis.tsv | xargs -0 -P 4 -n 2 bash -c 'emdl_one "$@"' _

          echo "== Pass 1: release assets (per-tag dirs, parallel)"
          gh api "repos/$repo/releases?per_page=100" --paginate \
            --jq '.[] | .tag_name as $t | .assets[] | select(.name | endswith(".apk")) | "\($t)\t\(.name)"' < /dev/null \
            | sort -u > assets.tsv
          wc -l assets.tsv

          dl_one() {
            local tag="$1" name="$2"
            mkdir -p "scan/$tag"
            if gh release download "$tag" -p "$name" -D "scan/$tag" --clobber -R "$repo" < /dev/null; then
              scan_file "scan/$tag/$name" "$tag/$name"
              rm -f "scan/$tag/$name"
            else
              echo "::warning title=dl-fail::$tag/$name"
            fi
          }
          export -f dl_one

          while IFS=$'\t' read -r tag name; do
            printf '%s\0%s\0' "$tag" "$name"
          done < assets.tsv | xargs -0 -P 4 -n 2 bash -c 'dl_one "$@"' _

          echo "== Pass 2: GitHub Actions artifacts from CI builds"
          if [ ! -f results/match_src ]; then
            gh api "repos/$repo/actions/artifacts?per_page=60" --paginate \
              --jq '.artifacts[] | select(.expired == false) | "\(.id)\t\(.name)"' < /dev/null | sort -u > arts.tsv
            wc -l arts.tsv
            art_one() {
              local id="$1" name="$2"
              mkdir -p "art/$id"
              if gh api "repos/$repo/actions/artifacts/$id/zip" < /dev/null > "art/$id/z.zip" 2>/dev/null; then
                unzip -o -q "art/$id/z.zip" -d "art/$id" 2>/dev/null
                find "art/$id" -name '*.apk' -type f | while read -r f; do
                  scan_file "$f" "artifact:$name($id)/$(basename "$f")"
                done
              fi
              rm -rf "art/$id"
            }
            export -f art_one
            while IFS=$'\t' read -r id name; do
              printf '%s\0%s\0' "$id" "$name"
            done < arts.tsv | xargs -0 -P 4 -n 2 bash -c 'art_one "$@"' _
          fi

          if [ ! -f results/match_src ]; then
            echo "::error title=no-match::sha256 $TARGET_SHA not found in ANY release asset, CI artifact, or the Emesis-renderer- repo ($(wc -l < results/hashes.txt 2>/dev/null || echo 0) files hashed; emesis.tsv had $(wc -l < emesis.tsv 2>/dev/null || echo 0) assets, assets.tsv had $(wc -l < assets.tsv 2>/dev/null || echo 0))"
            sort -u results/hashes.txt 2>/dev/null | head -80 | while read -r l; do echo "::notice title=hashed::$l"; done
            exit 1
          fi

          found_src=$(cat results/match_src)
          echo "MATCH: $found_src"
          echo "::notice title=MATCH::$TARGET_SHA == $found_src"
          echo "::notice title=verify-only::verification run, releasing is disabled in this revision"
          exit 3

          echo "== Resolve the full + noruntime pair"
          # source form: "<tag>/<asset>" for releases, "artifact:<name>(<id>)/<file>" for artifacts
          found_tag="${found_src%%/*}"
          : > SHA256SUMS
          if printf '%s' "$found_tag" | grep -q '^artifact:'; then
            echo "::error title=artifact-source::match came from a CI artifact ($found_src); pair resolution for artifacts is not wired up"
            exit 2
          fi
          src_body=$(gh api "repos/$repo/releases/tags/$found_tag" --jq '.body // ""' < /dev/null)
          gh api "repos/$repo/releases/tags/$found_tag" --jq '.assets[] | select(.name | endswith(".apk")) | .name' < /dev/null | sort -u > siblings.txt
          while read -r sib; do
            [ -z "$sib" ] && continue
            gh release download "$found_tag" -p "$sib" -D "scan/$found_tag" --clobber -R "$repo" < /dev/null
            f="scan/$found_tag/$sib"
            ssha=$(sha256sum "$f" | awk '{print $1}')
            case "$sib" in
              *noruntime*) base="Aerix-Launcher-$NEW_VERSION-noruntime.apk";;
              *) base="Aerix-Launcher-$NEW_VERSION.apk";;
            esac
            cp "$f" "out/$base"
            echo "$ssha  $base" >> SHA256SUMS
          done < siblings.txt

          echo "== Mirror the v1.3.x unversioned duplicate names"
          for f in out/*.apk; do
            b=$(basename "$f")
            unv=$(printf '%s' "$b" | sed "s/-$NEW_VERSION//")
            cp "$f" "out/$unv"
            grep "  $b\$" SHA256SUMS | sed "s/  $b\$/  $unv/" >> SHA256SUMS
          done
          sort -u SHA256SUMS -o SHA256SUMS
          cat SHA256SUMS

          target=$(printf '%s' "$src_body" | grep -oE 'build of [0-9a-f]{7,40}' | awk '{print $3}' | head -1)

          notes=$(mktemp)
          {
            echo "Re-release of the exact binary identified by"
            echo "\`sha256:$TARGET_SHA\` as version $NEW_VERSION."
            echo ""
            echo "Source artifact: \`$found_src\`."
            if [ -n "$target" ]; then echo "Built from commit \`$target\`."; fi
            echo ""
            echo "Checksums for every attachment are in \`SHA256SUMS\`."
          } > "$notes"

          create_args=(--repo "$repo" --title "Aerix Launcher $NEW_VERSION" --notes-file "$notes" --latest)
          if [ -n "$target" ]; then create_args+=(--target "$target"); fi
          gh release create "$NEW_TAG" "${create_args[@]}" out/*.apk SHA256SUMS < /dev/null
          echo "::notice title=done::released $NEW_TAG from $found_src"
