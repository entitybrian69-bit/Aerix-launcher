name: manual re-release 1.3.6

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/re-release-1.3.6.yml'
      - 'incoming/**'

permissions:
  contents: write

env:
  TARGET_SHA: a75fdfeb6c22ebf0c772c0a4f83ab53c103e4ad81d8105789deb0df9ebc232f3
  NEW_TAG: v1.3.6
  NEW_VERSION: "1.3.6"

jobs:
  rerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble uploaded APK, verify sha256, release as v1.3.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${{ github.repository }}"
          mkdir -p out

          if ! ls incoming/*.part* >/dev/null 2>&1; then
            echo "::notice title=skipping::no APK chunks in incoming/ yet - nothing to do"
            exit 0
          fi

          echo "== Reassemble chunks"
          ls -la incoming/
          apktmp=/tmp/Aerix-Launcher-$NEW_VERSION.apk
          cat $(ls -v incoming/*.part*) > "$apktmp"

          echo "== Verify sha256"
          sha=$(sha256sum "$apktmp" | awk '{print $1}')
          echo "$sha  $apktmp"
          echo "::notice title=sha::reassembled apk = $sha ($(stat -c%s "$apktmp") bytes)"
          if [ "$sha" != "$TARGET_SHA" ]; then
            echo "::error title=sha-mismatch::uploaded apk is $sha but you asked for $TARGET_SHA - refusing to publish wrong bytes"
            exit 1
          fi

          echo "== Match confirmed. Prepare assets"
          cp "$apktmp" "out/Aerix-Launcher-$NEW_VERSION.apk"
          cp "$apktmp" "out/Aerix-Launcher.apk"
          : > SHA256SUMS
          for f in out/*.apk; do
            echo "$(sha256sum "$f" | awk '{print $1}')  $(basename "$f")" >> SHA256SUMS
          done
          cat SHA256SUMS

          notes=$(mktemp)
          {
            echo "Release of the exact binary identified by"
            echo "\`sha256:$TARGET_SHA\` as version $NEW_VERSION."
            echo ""
            echo "Checksums for every attachment are in \`SHA256SUMS\`."
          } > "$notes"

          gh release create "$NEW_TAG" --repo "$repo" \
            --title "Aerix Launcher $NEW_VERSION" --notes-file "$notes" --latest \
            out/*.apk SHA256SUMS < /dev/null
          echo "::notice title=done::$NEW_TAG published"
