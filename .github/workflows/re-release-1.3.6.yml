name: manual re-release 1.3.6

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/re-release-1.3.6.yml'
      - 'incoming/**'

permissions:
  contents: write

env:
  # sha256 of the raw APK inside run 39413488311's app-release artifact
  # (the a75fdfeb... digest on the Actions page covers the artifact zip wrapper)
  TARGET_SHA: e3afc03e19d35b7dc32385af04e596866799485dd64bf833731790f8f400f069
  SRC_RUN: "39413488311"
  SRC_SHA: ba3e4c230a81275dfda296a121172a3752f9a913
  NEW_TAG: v1.3.6
  NEW_VERSION: "1.3.6"

jobs:
  rerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch APKs from Android CI run 39609549340, verify sha256, release as v1.3.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${{ github.repository }}"
          mkdir -p art out

          echo "== List artifacts of run $SRC_RUN"
          gh api "repos/$repo/actions/runs/$SRC_RUN/artifacts?per_page=50" < /dev/null \
            --jq '.artifacts[] | select(.expired == false) | "\(.id)\t\(.name)"' | sort -u > arts.tsv
          cat arts.tsv

          dl_art() { # id name
            mkdir -p "art/$2"
            gh api "repos/$repo/actions/artifacts/$1/zip" < /dev/null > "art/$2/z.zip"
            unzip -o -q "art/$2/z.zip" -d "art/$2"
            rm -f "art/$2/z.zip"
          }

          echo "== Recorded checksums from CI"
          sha_art_id=$(awk -F'\t' '$2=="apk-sha256"{print $1; exit}' arts.tsv)
          if [ -n "$sha_art_id" ]; then
            dl_art "$sha_art_id" "apk-sha256"
            cisha=$(find art/apk-sha256 -type f -exec cat {} + | tr '\n' ';')
            echo "$cisha"
            echo "::notice title=ci-sha256::$cisha"
          fi

          echo "== Download both APK artifacts"
          full_id=$(awk -F'\t' '$2=="app-release"{print $1; exit}' arts.tsv)
          nort_id=$(awk -F'\t' '$2=="app-release-noruntime"{print $1; exit}' arts.tsv)
          [ -n "$full_id" ] && dl_art "$full_id" "app-release"
          [ -n "$nort_id" ] && dl_art "$nort_id" "app-release-noruntime"

          sha_full=""; sha_nort=""
          [ -n "$full_id" ] && sha_full=$(find art/app-release -name '*.apk' -type f -exec sha256sum {} + | awk '{print $1}')
          [ -n "$nort_id" ] && sha_nort=$(find art/app-release-noruntime -name '*.apk' -type f -exec sha256sum {} + | awk '{print $1}')
          echo "::notice title=sha::app-release = $sha_full"
          echo "::notice title=sha::app-release-noruntime = $sha_nort"

          if [ "$sha_full" != "$TARGET_SHA" ] && [ "$sha_nort" != "$TARGET_SHA" ]; then
            echo "::error title=no-match::neither artifact of run $SRC_RUN matches $TARGET_SHA (full=$sha_full noruntime=$sha_nort)"
            exit 1
          fi
          echo "::notice title=MATCH::$TARGET_SHA verified against run $SRC_RUN"

          echo "== Assemble v1.3.6 assets"
          : > SHA256SUMS
          [ -n "$full_id" ] && cp "$(find art/app-release -name '*.apk' -type f | head -1)" "out/Aerix-Launcher-$NEW_VERSION.apk" \
            && echo "$sha_full  Aerix-Launcher-$NEW_VERSION.apk" >> SHA256SUMS
          [ -n "$nort_id" ] && cp "$(find art/app-release-noruntime -name '*.apk' -type f | head -1)" "out/Aerix-Launcher-$NEW_VERSION-noruntime.apk" \
            && echo "$sha_nort  Aerix-Launcher-$NEW_VERSION-noruntime.apk" >> SHA256SUMS
          for f in out/*.apk; do
            b=$(basename "$f")
            unv=$(printf '%s' "$b" | sed "s/-$NEW_VERSION//")
            cp "$f" "out/$unv"
            grep "  $b\$" SHA256SUMS | sed "s/  $b\$/  $unv/" >> SHA256SUMS
          done
          sort -u SHA256SUMS -o SHA256SUMS
          cat SHA256SUMS

          notes=$(mktemp)
          {
            echo "Re-release of Android CI run [$SRC_RUN](https://github.com/$repo/actions/runs/$SRC_RUN)"
            echo "(\`app-release\` artifact, built from commit \`$SRC_SHA\`) as version $NEW_VERSION."
            echo ""
            echo "Full APK: \`sha256:$TARGET_SHA\`."
            echo ""
            echo "Checksums for every attachment are in \`SHA256SUMS\`."
          } > "$notes"

          gh release create "$NEW_TAG" --repo "$repo" --target "$SRC_SHA" \
            --title "Aerix Launcher $NEW_VERSION" --notes-file "$notes" --latest \
            out/*.apk SHA256SUMS 2>gh_err.txt || {
            echo "::error title=release-create-failed::$(head -c 2000 gh_err.txt)"
            exit 1
          }
          echo "::notice title=done::$NEW_TAG published from CI run $SRC_RUN"
