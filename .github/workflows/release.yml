name: Release CI

# Public release build. It is only allowed to run after the owner asks for a
# release and types the confirmation below. Everything else gets tested on the
# debug APK built by aerix-debug.yml.
#
# A marked push has to touch this file to be seen at all, so each release cuts a
# one line note here recording what it shipped.
#
# Last cut: v1.4.1 - the Emesis renderer bundled as a built-in option.
#
# The job only produces artifacts. Publishing them is a separate, deliberate
# step: the assets are named after version.properties (Aerix-Launcher-<version>.apk
# and Aerix-Launcher-<version>-noruntime.apk) because the in-app updater looks
# for exactly those names on the release of that tag.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to build the public APK'
        required: true
        default: ''
  # A dispatch needs an Actions-write token. Where the tooling only has contents write, the same
  # build can be started by pushing a change to this file whose commit message carries the marker
  # below. Any other push only skips the job: the marker is the confirmation.
  push:
    branches: [ "arena/2f1249a3-aerix-launcher" ]
    paths: [ ".github/workflows/release.yml" ]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.inputs.confirm == 'RELEASE' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-release]'))
    runs-on: ubuntu-22.04
    env:
      POJAV_KEYSTORE_PASSWORD: ${{ secrets.POJAV_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create out directory
        run: mkdir out

      - name: Build Release .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleFullRelease
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/app-release.apk

      - name: Build no-runtime Release .apk
        run: |
          # The same build without an embedded Java runtime: it downloads the runtime it needs,
          # and it is the APK the -noruntime edition of the launcher updates itself with.
          gradle :app_pojavlauncher:assembleNoruntimeRelease
          mv app_pojavlauncher/build/outputs/apk/noruntime/release/app_pojavlauncher-noruntime-release.apk out/app-release-noruntime.apk

      - name: Name the assets after the version
        run: |
          set -e
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          test -n "$VERSION"
          mv out/app-release.apk "out/Aerix-Launcher-$VERSION.apk"
          mv out/app-release-noruntime.apk "out/Aerix-Launcher-$VERSION-noruntime.apk"
          cd out
          sha256sum Aerix-Launcher-*.apk > SHA256SUMS
          cat SHA256SUMS
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the package and version inside the APKs
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # build-tools carry aapt2; the runner image already has one.
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          test -n "$AAPT2"
          for apk in out/Aerix-Launcher-*.apk; do
            echo "== $apk"
            "$AAPT2" dump badging "$apk" | grep -E "^package:|^application-label:"
          done

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-full
          path: out/Aerix-Launcher-*.apk
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: app-release-checksums
          path: out/SHA256SUMS
          if-no-files-found: error

  # Publishes the release the build job produced. Kept apart from the build so a failure here never
  # leaves a half-built APK on the Releases page: the assets only go up once both files exist.
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          name: app-release-full
          path: dist

      - name: Download the checksums
        uses: actions/download-artifact@v4
        with:
          name: app-release-checksums
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          NOTES="docs/releases/v$VERSION.md"
          test -n "$VERSION"
          test -f "$NOTES"
          ls -l dist
          # The tag is the version; the in-app updater only accepts a stable release whose tag and
          # asset names match it, so a release that already exists is reported, never overwritten.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error title=release-exists::v$VERSION is already published"
            exit 1
          fi
          # The website's download buttons point at the unversioned names under
          # releases/latest/download, so the same bytes go up under both names.
          cp "dist/Aerix-Launcher-$VERSION.apk" dist/Aerix-Launcher.apk
          cp "dist/Aerix-Launcher-$VERSION-noruntime.apk" dist/Aerix-Launcher-noruntime.apk
          ( cd dist && sha256sum Aerix-Launcher-*.apk Aerix-Launcher.apk > SHA256SUMS && cat SHA256SUMS )
          TITLE=$(head -1 "$NOTES" | sed 's/^# //')
          gh release create "v$VERSION" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest \
            dist/Aerix-Launcher-*.apk dist/Aerix-Launcher.apk dist/SHA256SUMS
          gh release view "v$VERSION" --json tagName,name,url,assets \
            -q '.tagName, .name, .url, (.assets[] | "\(.name) \(.size) \(.digest // "-")")'
