name: Release CI

# Public release build. It is only allowed to run after the owner asks for a
# release and types the confirmation below. Everything else gets tested on the
# debug APK built by aerix-debug.yml.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to build the public APK'
        required: true
        default: ''

jobs:
  build:
    if: github.event.inputs.confirm == 'RELEASE'
    runs-on: ubuntu-22.04
    env:
      POJAV_KEYSTORE_PASSWORD: ${{ secrets.POJAV_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6  
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create out directory
        run: mkdir out

      - name: Build Release .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleFullRelease
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release.apk
