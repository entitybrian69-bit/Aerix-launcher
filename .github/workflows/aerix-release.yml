name: Aerix release

# Commits the no-runtime debug APK of a finished Android CI run into apk/ on the Aerix branch.
# The full APK (128 MB) is over GitHub's 100 MB file limit and LFS uploads are refused on forks;
# the no-runtime APK downloads every Java runtime on demand through NewJREUtil.
# Runs when this file changes on the Aerix branch; RUN_ID / BUILD_SHA select the CI run.
on:
  push:
    branches: [ "arena/68d5e5c9-aerix-launcher" ]
    paths: [ ".github/workflows/aerix-release.yml" ]

permissions:
  contents: write
  actions: read

env:
  RUN_ID: "38673475350"
  BUILD_SHA: "93fc6e0421dbe6ca8c0d9c9fb03c3cb7fcec1ad2"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aerix branch
        uses: actions/checkout@v4
        with:
          ref: arena/68d5e5c9-aerix-launcher
          fetch-depth: 1

      - name: Download no-runtime APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-noruntime
          path: out
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APKs to apk/
        shell: bash
        run: |
          report() {
            msg=$(tail -c 3000 step.log | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error title=commit-step::$msg"
          }
          exec > >(tee step.log) 2>&1
          trap report ERR
          set -e
          SHORT=${BUILD_SHA:0:7}
          git rm -q --ignore-unmatch apk/*.apk
          # git rm drops the directory once its last file is gone; recreate it before copying.
          mkdir -p apk
          cp out/app-debug-noruntime.apk "apk/Aerix-Launcher-$SHORT-debug.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          git commit -m "Build: Aerix APK $SHORT (CI run $RUN_ID) [skip ci]"
          git push origin HEAD:arena/68d5e5c9-aerix-launcher

