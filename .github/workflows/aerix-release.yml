name: Aerix release

# Publishes the debug APKs of a finished Android CI run as a GitHub pre-release.
# Runs when this file changes on the Aerix branch; RUN_ID / BUILD_SHA select the CI run.
on:
  push:
    branches: [ "arena/5d11b9a3-aerix-launcher" ]
    paths: [ ".github/workflows/aerix-release.yml" ]

permissions:
  contents: write
  actions: read

env:
  RUN_ID: "38597064949"
  BUILD_SHA: "65c7794d3898f56525054a528ba0c474618e014c"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download full APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: out
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download no-runtime APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-noruntime
          path: out
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT=${BUILD_SHA:0:7}
          TAG="aerix-ui-$SHORT"
          mv out/app-debug-full.apk "out/Aerix-Launcher-$SHORT-full-debug.apk"
          mv out/app-debug-noruntime.apk "out/Aerix-Launcher-$SHORT-noruntime-debug.apk"
          # The release and tag are created beforehand (tags on commits that touch workflow files
          # need the "workflows" scope, which GITHUB_TOKEN lacks); this job attaches the APKs.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk --target "$BUILD_SHA" --prerelease \
              --title "Aerix Launcher UI build $SHORT" \
              --notes "Debug build of the Aerix UI port on PojavLauncher (commit $BUILD_SHA, CI run $RUN_ID)."
          fi
