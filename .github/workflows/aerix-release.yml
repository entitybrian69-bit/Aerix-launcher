name: Aerix release

# Commits the debug APKs of a finished Android CI run into apk/ on the Aerix branch
# (Git LFS, because the full APK is larger than GitHub's 100 MB file limit).
# Runs when this file changes on the Aerix branch; RUN_ID / BUILD_SHA select the CI run.
on:
  push:
    branches: [ "arena/5d11b9a3-aerix-launcher" ]
    paths: [ ".github/workflows/aerix-release.yml" ]

permissions:
  contents: write
  actions: read

env:
  RUN_ID: "38597064949"
  BUILD_SHA: "65c7794d3898f56525054a528ba0c474618e014c"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aerix branch
        uses: actions/checkout@v4
        with:
          ref: arena/5d11b9a3-aerix-launcher
          fetch-depth: 1

      - name: Download full APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: out
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download no-runtime APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-noruntime
          path: out
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APKs to apk/
        run: |
          SHORT=${BUILD_SHA:0:7}
          mkdir -p apk
          git rm -q --ignore-unmatch apk/*.apk
          cp out/app-debug-full.apk "apk/Aerix-Launcher-$SHORT-full-debug.apk"
          cp out/app-debug-noruntime.apk "apk/Aerix-Launcher-$SHORT-noruntime-debug.apk"
          git lfs install --local
          git lfs track "apk/*.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes apk
          git commit -m "Build: Aerix APKs $SHORT (CI run $RUN_ID) [skip ci]"
          git push origin HEAD:arena/5d11b9a3-aerix-launcher
