name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # publish the finished APK as a pre-release
    env:
      POJAV_GPLAY_KEYSTORE_PASSWORD: ${{ secrets.POJAV_GPLAY_KEYSTORE_PASSWORD }}
      POJAV_KEYSTORE_PASSWORD: ${{ secrets.POJAV_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Create out directory
        run: mkdir out

      - name: Build Publishing .aab
        if: github.repository_owner == 'TeamPojavLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv app_pojavlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk (Full)
        shell: bash
        run: |
          # Build the launcher. tee keeps the log: a failed Gradle run otherwise leaves only
          # "Process completed with exit code 1" and the compiler errors are unreachable.
          set -o pipefail
          gradle :app_pojavlauncher:assembleFullDebug 2>&1 | tee build-full.log
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/app-debug-full.apk

      - name: Build Debug .apk (No runtime)
        shell: bash
        run: |
          # Build the launcher (without jre8 installed)
          set -o pipefail
          gradle :app_pojavlauncher:assembleNoruntimeDebug 2>&1 | tee build-noruntime.log
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/app-debug-noruntime.apk

      - name: Build Release .apk (Full)
        shell: bash
        run: |
          # The release variant is what ships: not debuggable, package id net.kdt.pojavlaunch.
          set -o pipefail
          gradle :app_pojavlauncher:assembleFullRelease 2>&1 | tee build-release-full.log
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/app-release-full.apk

      - name: Build Release .apk (No runtime)
        shell: bash
        run: |
          set -o pipefail
          gradle :app_pojavlauncher:assembleNoruntimeRelease 2>&1 | tee build-release-noruntime.log
          mv app_pojavlauncher/build/outputs/apk/noruntime/release/app_pojavlauncher-noruntime-release.apk out/app-release-noruntime.apk

      - name: Report Gradle errors
        if: failure()
        shell: bash
        run: |
          # One annotation carries every matching line; GitHub only shows ten annotations per
          # step, and a Kotlin build can produce more errors than that.
          logs="build-full.log build-noruntime.log build-release-full.log build-release-noruntime.log"
          errors=$({ grep -aEh '^e: ' $logs 2>/dev/null | head -25
            grep -aEh 'error: |Execution failed|What went wrong|FAILED|Could not|Caused by' $logs 2>/dev/null | head -35
          } | sed 's/%/%25/g' | tr '\n' '|' | cut -c1-6000)
          echo "::error title=gradle errors::${errors:-no error line matched}"
          for log in $logs; do
            [ -f "$log" ] && echo "::error title=gradle $log tail::$(tail -c 1200 "$log" | tr '\n' '|' | sed 's/%/%25/g')"
          done
          exit 0

      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5
          md5sum out/app-release-full.apk > out/app-release-full.md5
          md5sum out/app-release-noruntime.apk > out/app-release-noruntime.md5

      - name: Upload Debug APK (Full)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug-full.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.apk

      - name: Upload Release APK (Full)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-full
          path: out/app-release-full.apk

      - name: Upload Release APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-noruntime
          path: out/app-release-noruntime.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Publish build APK
        # A workflow artifact needs a signed-in GitHub session to download, and the phone that
        # installs this build does not have one. A pre-release puts the APK behind a plain link.
        # Release variant only: it is the one that ships, not debuggable, package net.kdt.pojavlaunch.
        if: github.event_name == 'push' && github.ref_name == 'arena/78fd95f3-aerix-launcher'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when the repository has no release keystore secret, in which case build.gradle
          # signs the release variant with the committed debug key and this note tells the truth.
          RELEASE_KEY: ${{ secrets.POJAV_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          tag="build-${GITHUB_RUN_ID}"
          if [ -n "$RELEASE_KEY" ]; then
            signing="Signed with the repository release key, so it upgrades the installed release build."
          else
            signing="No release keystore password is configured for this repository, so the release variant is signed with the debug key: uninstall an existing Aerix release build before installing this one."
          fi
          notes="Release build of ${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME}. $signing

          Two APKs: the full one bundles the Java runtime, the no-runtime one downloads it on first launch and is much smaller. Both are the release variant, not debuggable."
          cp out/app-release-noruntime.apk "Aerix-Launcher-${GITHUB_RUN_NUMBER}-release-noruntime.apk"
          cp out/app-release-full.apk "Aerix-Launcher-${GITHUB_RUN_NUMBER}-release.apk"
          gh release create "$tag" \
            "Aerix-Launcher-${GITHUB_RUN_NUMBER}-release.apk" \
            "Aerix-Launcher-${GITHUB_RUN_NUMBER}-release-noruntime.apk" \
            --title "Aerix Launcher ${GITHUB_RUN_NUMBER} (release)" \
            --notes "$notes" \
            --prerelease \
            --target "$GITHUB_SHA"
          echo "Published: $(gh release view "$tag" --json url --jq .url)"

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'TeamPojavLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
