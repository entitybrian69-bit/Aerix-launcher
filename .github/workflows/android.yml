name: Aerix Android CI

on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      POJAV_GPLAY_KEYSTORE_PASSWORD: ${{ secrets.POJAV_GPLAY_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Create out directory
        run: mkdir out

      - name: Verify bundled wallpaper catalog
        run: python3 scripts/verify_wallpapers.py

      - name: Verify Home layout variants
        run: python3 scripts/verify_launcher_layouts.py

      - name: Run launcher unit tests
        shell: bash
        run: |
          set +e
          gradle :app_pojavlauncher:testFullDebugUnitTest --console=plain 2>&1 | tee out/launcher-unit-tests.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("out/launcher-unit-tests.log").read_text(errors="replace").splitlines()[-45:]
          message = "%0A".join(line.replace("%", "%25").replace("\r", "%0D") for line in lines)
          print(f"::error title=Launcher unit-test failure::{message}")
          PY
          fi
          exit "$result"

      - name: Build Publishing .aab
        if: github.repository_owner == 'TeamPojavLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv app_pojavlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/app-gplay.aab

      - name: Build Debug APK (Full)
        run: |
          gradle :app_pojavlauncher:assembleFullDebug
          python3 scripts/verify_apk_abis.py app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/aerix-launcher-1.0.0-full-debug.apk

      - name: Build Debug APK (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          python3 scripts/verify_apk_abis.py app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/aerix-launcher-1.0.0-noruntime-debug.apk

      - name: Generate checksums
        run: |
          md5sum out/aerix-launcher-1.0.0-full-debug.apk > out/aerix-launcher-1.0.0-full-debug.md5
          md5sum out/aerix-launcher-1.0.0-noruntime-debug.apk > out/aerix-launcher-1.0.0-noruntime-debug.md5

      - name: Upload full debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aerix-launcher-1.0.0-full-debug
          path: |
            out/aerix-launcher-1.0.0-full-debug.apk
            out/aerix-launcher-1.0.0-full-debug.md5

      - name: Upload no-runtime debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aerix-launcher-1.0.0-noruntime-debug
          path: |
            out/aerix-launcher-1.0.0-noruntime-debug.apk
            out/aerix-launcher-1.0.0-noruntime-debug.md5

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'TeamPojavLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
