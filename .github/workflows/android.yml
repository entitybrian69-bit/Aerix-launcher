name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      POJAV_KEYSTORE_PASSWORD: ${{ secrets.POJAV_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Social architecture and resources
        run: python3 -m unittest discover -s tests -v
      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs
      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS || github.token }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build release APKs (artifacts only)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          signing=()
          if [ -z "$POJAV_KEYSTORE_PASSWORD" ]; then
            signing=(-PaerixTestSigning=true)
            echo "::warning::No production signing password is configured. Release variants will use the debug test key and cannot upgrade a production-signed installation."
            echo "Signing: **debug test key**, release variant, not debuggable. Cannot upgrade production-signed installations." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signing: repository release key." >> "$GITHUB_STEP_SUMMARY"
          fi
          gradle :app_pojavlauncher:assembleFullRelease :app_pojavlauncher:assembleNoruntimeRelease "${signing[@]}" --console=plain --stacktrace 2>&1 | tee build-release.log
          cp app_pojavlauncher/build/outputs/apk/full/release/*.apk out/Aerix-full-release.apk
          cp app_pojavlauncher/build/outputs/apk/noruntime/release/*.apk out/Aerix-noruntime-release.apk
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          for apk in out/*.apk; do
            "$signer" verify --verbose --print-certs "$apk" > "$apk.signing.txt"
            "$aapt" dump badging "$apk" > "$apk.manifest.txt"
            if grep -q '^application-debuggable' "$apk.manifest.txt"; then
              echo "::error::Release APK is unexpectedly debuggable"
              exit 1
            fi
          done
          sha256sum out/*.apk > out/SHA256SUMS
          echo "Release APKs are workflow artifacts only. No GitHub Release or Play upload was created." >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize compiler errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('build-release.log')
          if p.exists():
              errors = [line for line in p.read_text(errors='replace').splitlines() if line.startswith('e: ') or 'error:' in line or 'Execution failed' in line]
              for line in errors[:50]:
                  print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build-release.log
          if-no-files-found: ignore
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Aerix-release-apks
          path: out/
          if-no-files-found: error
          retention-days: 14
