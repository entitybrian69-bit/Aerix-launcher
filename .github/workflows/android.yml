name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # publish the finished APK as a pre-release
    env:
      POJAV_GPLAY_KEYSTORE_PASSWORD: ${{ secrets.POJAV_GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Create out directory
        run: mkdir out

      - name: Build Publishing .aab
        if: github.repository_owner == 'TeamPojavLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv app_pojavlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/app-gplay.aab

      # A failed Gradle build only leaves "Process completed with exit code 1" in the job, and the
      # log files themselves are not reachable from everywhere, so the compiler errors are repeated
      # as annotations: those are always readable through the API.
      # A failed Gradle build only leaves "Process completed with exit code 1" in the job, and the
      # log files themselves are not reachable from everywhere, so the compiler errors are repeated
      # as annotations: those are always readable through the API. One annotation carries all of
      # them, because GitHub only shows ten annotations per step and a build can carry more errors.
      - name: Prepare the failure reporter
        shell: bash
        run: |
          cat > report_gradle_failure.sh <<'HELPER'
          report_gradle_failure() {
            label=$1
            log=$2
            # Kotlin compiler errors go first: Gradle task lines used to fill the
            # 6000 character annotation limit and cut the actual error in half.
            errors=$({ grep -aE '^e: ' "$log" | head -20
              grep -aE 'error: |Execution failed|What went wrong|FAILED|Could not|Caused by' "$log" | head -40
            } | sed 's/%/%25/g; s/\r//g' | tr '\n' '|' | cut -c1-6000)
            echo "::error title=gradle $label::${errors:-no error line matched}"
            tailmsg=$(tail -c 1500 "$log" | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error title=gradle $label tail::$tailmsg"
          }
          HELPER
          cat report_gradle_failure.sh

      - name: Packaging policy tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Launcher regression tests
        shell: bash
        run: |
          if ! gradle :app_pojavlauncher:testNoruntimeReleaseUnitTest 2>&1 | tee regression-tests.log; then
            python3 - <<'PYREPORT'
          import glob, xml.etree.ElementTree as ET
          def annotate(title, text):
              text = text[:5000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={title}::{text}')
          count = 0
          for file in glob.glob('app_pojavlauncher/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(file).getroot().iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None and count < 8:
                      annotate(case.get('classname', '') + '.' + case.get('name', ''), failure.get('message', '') + '\n' + (failure.text or ''))
                      count += 1
          if not count:
              annotate('regression test failure', open('regression-tests.log').read()[-5000:])
          PYREPORT
            exit 1
          fi

      - name: Upload regression test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-regression-reports
          path: app_pojavlauncher/build/test-results/

      - name: Build Release .apk (Full)
        shell: bash
        run: |
          . ./report_gradle_failure.sh
          assert_apk() {
            [ -f "$2" ] || { echo "::error title=missing apk::$2 was not produced"; ls -R app_pojavlauncher/build/outputs/apk || true; exit 1; }
            mv "$2" "$3"
          }
          if ! gradle :app_pojavlauncher:assembleFullRelease 2>&1 | tee build-full.log; then
            report_gradle_failure full build-full.log
            exit 1
          fi
          # Build the launcher
          assert_apk full app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/app-release-full.apk

      - name: Build Release .apk (No runtime)
        shell: bash
        run: |
          . ./report_gradle_failure.sh
          if ! gradle :app_pojavlauncher:assembleNoruntimeRelease 2>&1 | tee build-noruntime.log; then
            report_gradle_failure noruntime build-noruntime.log
            exit 1
          fi
          # Build the launcher (without jre8 installed)
          [ -f app_pojavlauncher/build/outputs/apk/noruntime/release/app_pojavlauncher-noruntime-release.apk ] \
            || { echo "::error title=missing apk::the noruntime apk was not produced"; ls -R app_pojavlauncher/build/outputs/apk || true; exit 1; }
          mv app_pojavlauncher/build/outputs/apk/noruntime/release/app_pojavlauncher-noruntime-release.apk out/app-release-noruntime.apk

      - name: Native FPS counter regression test
        run: |
          cc -std=c11 -pthread -I app_pojavlauncher/src/main/jni/fps \
            app_pojavlauncher/src/main/jni/fps/frame_counter.c \
            app_pojavlauncher/src/test/native/frame_counter_test.c -o "$RUNNER_TEMP/fps-counter-test"
          "$RUNNER_TEMP/fps-counter-test"

      - name: Verify removed renderer is absent from APKs
        run: python3 scripts/verify_removed_renderer.py out/app-release-full.apk out/app-release-noruntime.apk

      - name: Gen md5sums
        run: |
          sha256sum out/app-release-full.apk out/app-release-noruntime.apk > out/SHA256SUMS
          md5sum out/app-release-full.apk > out/app-release-full.md5
          md5sum out/app-release-noruntime.apk > out/app-release-noruntime.md5

      - name: Upload APK SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: apk-sha256
          path: out/SHA256SUMS

      - name: Upload Release APK (Full)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release-full.apk

      - name: Upload Release APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-noruntime
          path: out/app-release-noruntime.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Verify the release signing identity
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Android refuses an update whose certificate differs from the installed one, and the
          # package installer reports that as "can't be installed as it is incompatible". Read the
          # certificate out of the finished APK and compare it with the published v1.3.5 build
          # instead of trusting that Gradle picked the keystore that ships in the tree.
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          cert_of() {
            if [ -n "$build_tools" ] && [ -x "$build_tools/apksigner" ]; then
              "$build_tools/apksigner" verify --print-certs "$1" | grep -m1 -i 'SHA-256 digest' | awk '{print $NF}'
            else
              keytool -printcert -jarfile "$1" | grep -m1 'SHA256:' | sed 's/.*SHA256: //; s/ .*//'
            fi
          }
          new_cert=$(cert_of out/app-release-full.apk)
          gh release download v1.3.5 --pattern 'Aerix-Launcher.apk' --dir refapk --clobber
          ref_cert=$(cert_of refapk/Aerix-Launcher.apk)
          echo "this build : ${new_cert:-<unreadable>}"
          echo "v1.3.5     : ${ref_cert:-<unreadable>}"
          if [ -n "$new_cert" ] && [ "$new_cert" = "$ref_cert" ]; then
            echo "SIGNING_MATCH=true" >> "$GITHUB_ENV"
            echo "Certificate matches the published v1.3.5 APK, so this build upgrades an existing install."
          else
            echo "SIGNING_MATCH=false" >> "$GITHUB_ENV"
            echo "::error title=signing mismatch::this build ${new_cert:-unreadable} vs published v1.3.5 ${ref_cert:-unreadable}"
          fi

      - name: Publish build APK
        # A workflow artifact needs a signed-in GitHub session to download, and the phone that
        # installs this build does not have one. A pre-release puts the APK behind a plain link.
        # Pre-release on purpose: the in-app updater reads the latest stable release only.
        if: github.event_name == 'push' && github.ref_name == 'arena/78fd95f3-aerix-launcher'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="build-${GITHUB_RUN_ID}"
          version=$(sed -n 's/^versionName=//p' version.properties)
          version=${version:-unknown}
          if [ "${SIGNING_MATCH:-}" = "true" ]; then
            signing="Signed with the Aerix release key, and the certificate matches the published v1.3.5 APK, so this installs over an existing Aerix without uninstalling it."
          else
            signing="The signing certificate could not be confirmed against the published v1.3.5 APK. If the install is refused as incompatible, uninstall the existing Aerix first."
          fi
          notes="Release build of ${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME}, version ${version}. ${signing}

          Two APKs: the full one bundles the Java runtime, the no-runtime one downloads it on first launch and is much smaller. Both are the release variant, not debuggable, package id net.kdt.pojavlaunch."
          cp out/app-release-full.apk "Aerix-Launcher-${version}-b${GITHUB_RUN_NUMBER}-release.apk"
          cp out/app-release-noruntime.apk "Aerix-Launcher-${version}-b${GITHUB_RUN_NUMBER}-release-noruntime.apk"
          gh release create "$tag" \
            "Aerix-Launcher-${version}-b${GITHUB_RUN_NUMBER}-release.apk" \
            "Aerix-Launcher-${version}-b${GITHUB_RUN_NUMBER}-release-noruntime.apk" \
            out/SHA256SUMS \
            --title "Aerix Launcher ${version} build ${GITHUB_RUN_NUMBER} (release)" \
            --notes "$notes" \
            --prerelease \
            --target "$GITHUB_SHA"
          echo "Published: $(gh release view "$tag" --json url --jq .url)"

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'TeamPojavLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
