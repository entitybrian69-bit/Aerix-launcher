name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  rustgl-native:
    name: Build experimental RustGL GLES bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned renderer source
        uses: actions/checkout@v4
        with:
          repository: whaltermc/rust-renderer
          ref: eb22559581cf400af29470205a9ebbff31e0db33
          path: .cache/rustgl-source
          persist-credentials: false
      - name: Install Rust and Android toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rust-docs
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          fi
      - name: Rust cache identity
        id: rust-cache
        run: echo "version=$(rustc --version | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache pinned Rust dependencies and compilation
        uses: actions/cache@v4
        with:
          key: rustgl-probe1-eb225595-ndk29-api26-16k-${{ runner.os }}-${{ steps.rust-cache.outputs.version }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/rustgl-source/target
      - name: Compile and inspect native renderer with license evidence
        shell: bash
        run: |
          set -o pipefail
          if ! python3 scripts/build_rustgl_bundle.py --source .cache/rustgl-source \
              --ndk "$ANDROID_HOME/ndk/29.0.14206865" --report .cache/rustgl-report 2>&1 | tee rustgl-build.log; then
            detail=$(tail -c 5000 rustgl-build.log | sed 's/%/%25/g; s/\r//g' | tr '\n' '|')
            echo "::error title=RustGL native build::$detail"
            exit 1
          fi
      - name: Renderer core unit tests
        working-directory: .cache/rustgl-source
        run: cargo test --locked -p renderer-core
      - name: RustGL compatibility-layer unit tests (serialized global GL state)
        working-directory: .cache/rustgl-source
        shell: bash
        run: |
          set -o pipefail
          export RUSTFLAGS="-Awarnings -C link-arg=-Wl,--export-dynamic"
          if ! cargo test --locked -p gl-compat --lib -- --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/rustgl-compat.log"; then
            detail=$(tail -c 3500 "$GITHUB_WORKSPACE/rustgl-compat.log" | sed 's/%/%25/g; s/\r//g' | tr '\n' '|')
            echo "::error title=RustGL compatibility tests::$detail"
            exit 1
          fi
      - name: Real RustGL EGL/GLES host smoke test
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
          (cd .cache/rustgl-source && cargo build --locked --release -p gl-compat)
          if ! python3 -u scripts/smoke_rustgl.py .cache/rustgl-source/target/release/librust_gl.so 2>&1 | tee rustgl-smoke.log; then
            detail=$(tail -c 3500 rustgl-smoke.log | sed 's/%/%25/g; s/\r//g' | tr '\n' '|')
            echo "::error title=RustGL EGL smoke::$detail"
            exit 1
          fi
      - name: Upload authenticated-build input assets
        uses: actions/upload-artifact@v4
        with:
          name: rustgl-bundle-assets
          path: app_pojavlauncher/src/main/assets/renderer-bundles/rustgl/
          if-no-files-found: error
      - name: Upload experimental licensing and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustgl-build-evidence
          include-hidden-files: true
          path: |
            .cache/rustgl-report/evidence/
            .cache/rustgl-report/experimental-approval.json
            rustgl-build.log
            rustgl-smoke.log
            rustgl-compat.log

  build:
    needs: rustgl-native
    runs-on: ubuntu-22.04
    env:
      POJAV_GPLAY_KEYSTORE_PASSWORD: ${{ secrets.POJAV_GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Download this run's verified RustGL bundle
        uses: actions/download-artifact@v4
        with:
          name: rustgl-bundle-assets
          path: app_pojavlauncher/src/main/assets/renderer-bundles/rustgl

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Create out directory
        run: mkdir out

      - name: Build Publishing .aab
        if: github.repository_owner == 'TeamPojavLauncher' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv app_pojavlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/app-gplay.aab

      # A failed Gradle build only leaves "Process completed with exit code 1" in the job, and the
      # log files themselves are not reachable from everywhere, so the compiler errors are repeated
      # as annotations: those are always readable through the API.
      # A failed Gradle build only leaves "Process completed with exit code 1" in the job, and the
      # log files themselves are not reachable from everywhere, so the compiler errors are repeated
      # as annotations: those are always readable through the API. One annotation carries all of
      # them, because GitHub only shows ten annotations per step and a build can carry more errors.
      - name: Prepare the failure reporter
        shell: bash
        run: |
          cat > report_gradle_failure.sh <<'HELPER'
          report_gradle_failure() {
            label=$1
            log=$2
            errors=$(grep -E '^e: |error: |Execution failed|What went wrong|FAILED|Could not|Caused by' "$log" \
              | head -60 | sed 's/%/%25/g; s/\r//g' | tr '\n' '|' | cut -c1-6000)
            echo "::error title=gradle $label::${errors:-no error line matched}"
            tailmsg=$(tail -c 1500 "$log" | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error title=gradle $label tail::$tailmsg"
          }
          HELPER
          cat report_gradle_failure.sh

      - name: Renderer importer and benchmark tool tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_renderer*.py' -v

      - name: Launcher regression tests
        shell: bash
        run: |
          if ! gradle :app_pojavlauncher:testNoruntimeReleaseUnitTest 2>&1 | tee regression-tests.log; then
            python3 - <<'PYREPORT'
          import glob, xml.etree.ElementTree as ET
          def annotate(title, text):
              text = text[:5000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={title}::{text}')
          count = 0
          for file in glob.glob('app_pojavlauncher/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(file).getroot().iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None and count < 8:
                      annotate(case.get('classname', '') + '.' + case.get('name', ''), failure.get('message', '') + '\n' + (failure.text or ''))
                      count += 1
          if not count:
              annotate('regression test failure', open('regression-tests.log').read()[-5000:])
          PYREPORT
            exit 1
          fi

      - name: Upload regression test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-regression-reports
          path: app_pojavlauncher/build/test-results/

      - name: Build Release .apk (Full)
        shell: bash
        run: |
          . ./report_gradle_failure.sh
          assert_apk() {
            [ -f "$2" ] || { echo "::error title=missing apk::$2 was not produced"; ls -R app_pojavlauncher/build/outputs/apk || true; exit 1; }
            mv "$2" "$3"
          }
          if ! gradle :app_pojavlauncher:assembleFullRelease 2>&1 | tee build-full.log; then
            report_gradle_failure full build-full.log
            exit 1
          fi
          # Build the launcher
          assert_apk full app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/app-release-full.apk

      - name: Build Release .apk (No runtime)
        shell: bash
        run: |
          . ./report_gradle_failure.sh
          if ! gradle :app_pojavlauncher:assembleNoruntimeRelease 2>&1 | tee build-noruntime.log; then
            report_gradle_failure noruntime build-noruntime.log
            exit 1
          fi
          # Build the launcher (without jre8 installed)
          [ -f app_pojavlauncher/build/outputs/apk/noruntime/release/app_pojavlauncher-noruntime-release.apk ] \
            || { echo "::error title=missing apk::the noruntime apk was not produced"; ls -R app_pojavlauncher/build/outputs/apk || true; exit 1; }
          mv app_pojavlauncher/build/outputs/apk/noruntime/release/app_pojavlauncher-noruntime-release.apk out/app-release-noruntime.apk

      - name: Startup mirror native regression test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined \
            -I app_pojavlauncher/src/main/jni/diagnostics \
            app_pojavlauncher/src/main/jni/diagnostics/startup_mirror.c \
            app_pojavlauncher/src/test/native/startup_mirror_test.c -o "$RUNNER_TEMP/startup-mirror-test"
          "$RUNNER_TEMP/startup-mirror-test"

      - name: Native FPS counter regression test
        run: |
          cc -std=c11 -pthread -I app_pojavlauncher/src/main/jni/fps \
            app_pojavlauncher/src/main/jni/fps/frame_counter.c \
            app_pojavlauncher/src/test/native/frame_counter_test.c -o "$RUNNER_TEMP/fps-counter-test"
          "$RUNNER_TEMP/fps-counter-test"

      - name: Verify final APKs contain RustGL for every ABI
        run: python3 scripts/verify_rustgl_apk.py out/app-release-full.apk out/app-release-noruntime.apk

      - name: Gen md5sums
        run: |
          sha256sum out/app-release-full.apk out/app-release-noruntime.apk > out/SHA256SUMS
          md5sum out/app-release-full.apk > out/app-release-full.md5
          md5sum out/app-release-noruntime.apk > out/app-release-noruntime.md5

      - name: Upload APK SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: apk-sha256
          path: out/SHA256SUMS

      - name: Upload Release APK (Full)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/app-release-full.apk

      - name: Upload Release APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-noruntime
          path: out/app-release-noruntime.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'TeamPojavLauncher' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
