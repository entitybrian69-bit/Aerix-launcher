name: CurseForge live metadata check

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/check_curseforge.py
      - scripts/compare_curseforge_clients.py
      - .github/workflows/curseforge-connectivity.yml

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compare historical and current real Java clients (no API keys)
        run: python3 scripts/compare_curseforge_clients.py
      # Recheck official access after repository credential configuration; never log the secret.
      - name: Check configured official access and mirror metadata
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 scripts/check_curseforge.py
