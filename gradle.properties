# required for building jre_lwjgl3glfw with Java 8 while using plugins in app_pojavlauncher that require Java 11
org.gradle.configureondemand=true

android.useAndroidX=true
android.bundle.language.enableSplit=false
# Increase Gradle daemon RAM allocation
org.gradle.jvmargs=-Xmx4096M
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Google sign-in for Aerix Social.
# Paste the OAuth 2.0 client id of type "Web application" from Google Cloud Console here
# (APIs & Services -> Credentials -> Create credentials -> OAuth client ID -> Web application).
# Leave empty and the launcher runs without Google sign-in instead of faking it.
# This client is a public identifier, not a secret, so it is safe in the tree.
# Advanced Settings (session age / auth strength claims) stay off; they need a verified app.
aerixGoogleWebClientId=209909107895-r8kk7b98baqqfjrnb0e8226ll4f1hsqg.apps.googleusercontent.com
