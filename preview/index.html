<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerix Lobby — UI preview</title>
<style>
@font-face{font-family:'MinecraftTen';src:url('/app_pojavlauncher/src/main/res/font/minecraft_ten.ttf') format('truetype');font-display:block}
:root{
  --ink:#0a0e14; --panel:#131b26; --panel-soft:#1d2835; --line:#33404e;
  --blue:#2e7ad4; --blue-dark:#17457f; --green:#55af39; --green-dark:#2d6b22;
  --yellow:#f4c53e; --yellow-dark:#9a7415; --red:#d93b4e; --white:#f5f7fa; --muted:#afbac6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#08121b;overflow:hidden;font-family:'MinecraftTen',monospace;color:var(--white)}
.lobby{position:relative;width:100vw;height:100vh;overflow:hidden}
.bg{position:absolute;inset:-2%;background:url('/app_pojavlauncher/src/main/assets/wallpapers/wp_26_lobby_village.jpg') center/cover no-repeat;filter:blur(3px) saturate(1.06)}
.scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(8,16,24,.38),rgba(8,16,24,0) 46%,rgba(6,12,20,.60)),
  linear-gradient(90deg,rgba(6,12,20,.42),rgba(6,12,20,0) 26%,rgba(6,12,20,0) 74%,rgba(6,12,20,.42))}
.blocky{border:3px solid var(--ink);box-shadow:6px 7px 0 rgba(4,7,12,.92);cursor:pointer;transition:transform .09s steps(2,end)}
.blocky:active{transform:translate(3px,4px);box-shadow:3px 3px 0 rgba(4,7,12,.92)}
img.pixel{image-rendering:pixelated;image-rendering:crisp-edges}

.player{position:absolute;left:30%;top:1%;width:40%;height:96%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.player img{height:94%;filter:drop-shadow(0 20px 18px rgba(0,0,0,.6))}
.player .hint{position:absolute;bottom:2%;font-size:11px;color:#dbe6f2;text-shadow:2px 2px 0 #05080d;letter-spacing:.5px}

.feature{position:absolute;width:17%;height:23%;background:var(--panel-soft)}
.feature .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature .label{position:absolute;bottom:0;left:0;right:0;height:30px;background:rgba(9,14,20,.86);display:flex;align-items:center;justify-content:center;font-size:12px;white-space:nowrap;overflow:hidden}
.feature .note{position:absolute;top:calc(100% + 7px);width:100%;text-align:center;font-size:10px;text-shadow:2px 3px 0 #070a10;white-space:nowrap;overflow:hidden}
.feature .badge{position:absolute;top:-9px;left:-9px;width:27px;height:27px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:19px;font-weight:bold;z-index:3}
.feature .dot{position:absolute;top:-7px;right:-7px;width:15px;height:15px;background:var(--red);border:2px solid var(--ink);border-radius:50%;z-index:3}
.f-shop{left:2.8%;top:4.5%;transform:rotate(-1.5deg)}
.f-skin{left:2.3%;top:33.5%;transform:rotate(1.2deg)}
.f-friends{left:2.8%;top:62.5%;transform:rotate(-1deg)}

.chrome{position:absolute;right:1.4%;top:5%;display:flex;gap:8px;z-index:4}
.icon{width:44px;height:44px;background:var(--panel);border:3px solid #070a0f;box-shadow:4px 5px 0 rgba(4,7,12,.92);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon img{width:24px;height:24px}
.icon:active{transform:translate(2px,3px)}

.promo{position:absolute;right:1.8%;top:29%;width:19.5%;height:34%;background:#0b0e14;border-color:#2c333d;z-index:2}
.promo .inner{position:absolute;inset:0;padding:13px;display:flex;flex-direction:column;justify-content:space-between}
.promo .kicker{font-size:9px;color:var(--muted);line-height:1.4}
.promo .big{font-size:clamp(13px,1.55vw,22px);text-shadow:3px 4px 0 #070a10;white-space:nowrap}
.promo .yellow{font-size:clamp(11px,1.15vw,16px);color:var(--yellow);text-shadow:3px 4px 0 #070a10;white-space:nowrap}
.promo .plus{align-self:flex-end;background:#7b45c9;border:2px solid #4b2a7e;padding:4px 9px;font-size:11px}
.dash{position:absolute;right:1.8%;top:calc(29% + 34% + 9px);width:28px;height:4px;background:#fff}

.social-row{position:absolute;left:50%;bottom:29.5%;transform:translateX(-50%);display:flex;gap:10px;z-index:3}
.social{width:15.5vw;height:8.5vh;background:rgba(18,24,34,.92);border-color:#39424d;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11px;white-space:nowrap}
.social img{width:20px;height:20px;flex:none}

.dock{position:absolute;left:21%;bottom:2.5%;width:58%;height:21.5%;background:var(--panel);border-color:var(--line);z-index:3}
.dock .row{position:absolute;inset:0;padding:9px;display:flex;align-items:stretch;gap:9px}
.tile{min-width:0;display:flex;position:relative}
.tile.blue{flex:1.25;background:var(--blue);border-color:var(--blue-dark);align-items:center;padding:0 12px;gap:8px}
.tile.blue .txt{flex:1;min-width:0}
.tile.blue .kick{font-size:9px;color:var(--yellow)}
.tile.blue .name{font-size:clamp(11px,1.15vw,16px);text-shadow:3px 4px 0 #070a10;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.blue .sub{font-size:10px;color:#dcebff;font-family:sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.blue img{width:34px;height:34px;flex:none}
.tile.green{flex:.85;background:var(--green);border-color:var(--green-dark);align-items:center;padding:0 12px;gap:8px}
.tile.green .txt{flex:1;min-width:0}
.tile.green .big{font-size:clamp(16px,1.65vw,23px);text-shadow:3px 4px 0 #070a10}
.tile.green .sub{font-size:10px;color:#e8ffe0}
.tile.green img{width:30px;height:30px;flex:none}
.tile.yellow{flex:.62;background:var(--yellow);border-color:var(--yellow-dark);flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);text-align:center}
.tile.yellow img{width:32px;height:32px}
.tile.yellow span{font-size:10px;line-height:1.2}
.tile.x{flex:none;width:30px;height:30px;align-self:center;background:#2a3440;border-color:#0a0e13;display:flex;align-items:center;justify-content:center}
.tile.x img{width:16px;height:16px}
.dock-caption{position:absolute;top:-22px;left:9px;font-size:10px;color:var(--yellow);text-shadow:2px 2px 0 #05080d}

.help{position:absolute;right:1.2%;bottom:3.5%;width:9.5%;height:8.5%;background:rgba(18,24,34,.92);border-color:#39424d;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;z-index:3}
.help img{width:20px;height:20px}

.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%) translateY(80px);background:#101923;border:3px solid var(--line);box-shadow:5px 6px 0 rgba(4,7,12,.9);padding:10px 16px;font-size:11px;opacity:0;transition:.18s steps(3,end);z-index:20;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.menu{position:fixed;inset:0;background:rgba(5,9,16,.78);display:none;align-items:center;justify-content:center;z-index:15}
.menu.open{display:flex}
.menu .panel{width:min(760px,86vw);background:var(--panel);border:3px solid var(--line);box-shadow:8px 9px 0 rgba(4,7,12,.92);padding:18px}
.menu h2{margin:0 0 14px;font-size:16px;text-shadow:3px 4px 0 #070a10}
.menu .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu .cell{height:44px;background:var(--panel-soft);border:3px solid var(--line);box-shadow:4px 5px 0 rgba(4,7,12,.92);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
.menu .cell:active{transform:translate(2px,3px)}
.menu .wide{grid-column:1/-1;background:#243040}
.menu .close{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-family:inherit;font-size:11px;cursor:pointer}

/* Portrait / narrow screens: stack the same tiles instead of the absolute lobby. */
@media (max-aspect-ratio: 1/1), (max-width: 679px){
  html,body{overflow:auto}
  .lobby{height:auto;min-height:100vh;overflow:visible;padding:14px;display:flex;flex-direction:column;gap:14px}
  .bg,.scrim{position:fixed}
  .player{position:relative;left:auto;top:auto;width:100%;height:42vh;min-height:240px}
  .player img{height:100%}
  .chrome{position:relative;right:auto;top:auto;align-self:flex-end}
  .feature,.promo,.social-row,.dock,.help,.dash{position:relative;inset:auto;left:auto;right:auto;top:auto;bottom:auto;width:100%;height:auto;transform:none}
  .left-row{display:flex;gap:8px;width:100%}
  .left-row .feature{width:33.33%;height:120px;flex:1}
  .feature .note{top:calc(100% + 5px)}
  .promo{height:132px}
  .social-row{flex-direction:row}
  .social{flex:1;width:auto;height:48px}
  .dock{height:176px}
  .help{width:120px;height:44px;align-self:flex-end}
  .dash{display:none}
}
</style>
</head>
<body>
<div class="lobby">
  <div class="bg"></div><div class="scrim"></div>

  <div class="player">
    <img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_player.png" alt="Your Minecraft skin">
    <div class="hint">DRAG TO ROTATE IN THE APP</div>
  </div>

  <div class="left-row">
    <div class="feature f-shop blocky" data-action="Discover — mods, modpacks and packs">
      <img class="art pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_card_shop.png" alt="">
      <div class="badge">!</div>
      <div class="label">SHOP</div><div class="note">Bonus waiting</div>
    </div>
    <div class="feature f-skin blocky" data-action="Accounts — your skin and wardrobe">
      <img class="art pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_card_skin.png" alt="">
      <div class="label">MY SKIN</div><div class="note">Change your look</div>
    </div>
    <div class="feature f-friends blocky" data-action="Socials — parties and friends">
      <img class="art pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_card_friends.png" alt="">
      <div class="dot"></div>
      <div class="label">PLAY WITH FRIENDS</div><div class="note">Party up</div>
    </div>
  </div>

  <div class="chrome">
    <div class="icon" id="menuBtn" title="All sections"><img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_grid.png" alt="Menu"></div>
    <div class="icon" data-action="Accounts"><img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_head.png" alt="Accounts"></div>
    <div class="icon" data-action="Daily reward — a random wallpaper"><img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_gift.png" alt="Gift"></div>
    <div class="icon" data-action="Settings"><img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_settings.png" alt="Settings"></div>
  </div>

  <div class="promo blocky" data-action="Invite link copied to the clipboard">
    <div class="inner">
      <div class="kicker">+1 REWARD FOR EVERY FRIEND</div>
      <div><div class="big">PLAY TOGETHER</div><div class="yellow">INVITE A FRIEND</div></div>
      <div class="plus">AERIX</div>
    </div>
  </div>
  <div class="dash"></div>

  <div class="social-row">
    <div class="social blocky" data-action="Socials — find a party"><img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_search.png" alt="">Find a party</div>
    <div class="social blocky" data-action="Invite link copied to the clipboard"><img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_person_add.png" alt="">Invite a friend</div>
  </div>

  <div class="dock blocky">
    <div class="dock-caption">START HERE</div>
    <div class="row">
      <div class="tile blue blocky" data-action="Instance picker — switch profile">
        <div class="txt"><div class="kick">START HERE</div><div class="name">Fabric 1.20.1</div><div class="sub">Fabric · 1.20.1</div></div>
        <img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_chest.png" alt="">
      </div>
      <div class="tile green blocky" data-action="Play — launches the selected instance">
        <div class="txt"><div class="big">Play</div><div class="sub">Ready</div></div>
        <img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_cursor.png" alt="">
      </div>
      <div class="tile yellow blocky" data-action="Open chest — reveals a wallpaper">
        <img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_chest.png" alt=""><span>Open chest</span>
      </div>
      <div class="tile x blocky" data-action="Collapse the START HERE hint"><img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_close.png" alt="Close"></div>
    </div>
  </div>

  <div class="help blocky" data-action="Help — tour, website, Discord, logs"><img class="pixel" src="/app_pojavlauncher/src/main/res/drawable-nodpi/aerix_lobby_ic_headset.png" alt="">Help</div>
</div>

<div class="toast" id="toast"></div>
<div class="menu" id="menu">
  <div class="panel">
    <h2>ALL SECTIONS</h2>
    <div class="grid" id="menuGrid"></div>
    <button class="close" id="menuClose">CLOSE</button>
  </div>
</div>

<script>
const sections = ['Home','Library','Servers','Discover','Socials','Themes','Content','Files','Logs','Accounts','Settings','About'];
const grid = document.getElementById('menuGrid');
sections.forEach(name => {
  const cell = document.createElement('div');
  cell.className = 'cell'; cell.textContent = name.toUpperCase();
  cell.dataset.action = name === 'Home' ? 'Already on the Lobby' : name + ' — opens in the app';
  grid.appendChild(cell);
});
const classic = document.createElement('div');
classic.className = 'cell wide'; classic.textContent = 'SWITCH BACK TO THE CLASSIC DASHBOARD';
classic.dataset.action = 'Settings → Lobby home screen (off)';
grid.appendChild(classic);

let timer;
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(timer); timer = setTimeout(() => el.classList.remove('show'), 1700);
}
document.addEventListener('click', e => {
  const tile = e.target.closest('[data-action]');
  if(tile){ toast(tile.dataset.action); }
});
document.getElementById('menuBtn').addEventListener('click', e => {
  e.stopPropagation(); document.getElementById('menu').classList.add('open');
});
document.getElementById('menuClose').addEventListener('click', e => {
  e.stopPropagation(); document.getElementById('menu').classList.remove('open');
});
document.getElementById('menu').addEventListener('click', e => {
  if(e.target.id === 'menu') e.currentTarget.classList.remove('open');
});
</script>
</body>
</html>
