appId: io.aerix.launcher.pc
productName: Aerix Launcher PC
copyright: Copyright © 2026 Aerix Launcher Contributors
asar: true
publish: null
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
icon: build/icon.png
win:
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  verifyUpdateCodeSignature: false
  legalTrademarks: Aerix Launcher Contributors
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: Aerix-PC-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aerix Launcher PC
linux:
  category: Game
  synopsis: Aerix Launcher PC for Minecraft Java Edition
  maintainer: Aerix Launcher Contributors <support@aerixlauncher.org>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  artifactName: Aerix-PC-${version}-linux-${arch}.${ext}
mac:
  category: public.app-category.games
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: Aerix-PC-${version}-mac-${arch}.${ext}
